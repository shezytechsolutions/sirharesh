<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} - AIMS Sukkur</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f6fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1b2a4a}
  .box{max-width:460px;margin:24px;padding:40px 32px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(20,40,90,.10);text-align:center}
  .code{font-size:64px;font-weight:800;line-height:1;color:#f5a623;margin:0 0 8px}
  h1{font-size:22px;margin:0 0 10px} p{margin:0 0 24px;color:#5b6b8c;line-height:1.5}
  a{display:inline-block;padding:11px 24px;background:#1b2a4a;color:#fff;border-radius:8px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="box">
    <div class="code">{{ code }}</div>
    <h1>{{ title }}</h1>
    <p>{{ text }}</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
