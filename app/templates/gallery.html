<!doctype html>
<html class="no-js" lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Gallery - AIMS SUKKUR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0">
    <link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user/font-awesome.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user/material-design-iconic-font.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user/plugin.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user/responsive.css') }}">
</head>
<body>
    <div class="loading"><div class="text-center middle"><div class="lds-ellipsis"><div></div><div></div><div></div><div></div></div></div></div>
    <div class="as-mainwrapper"><div class="bg-white">

    {% include 'includes/header.html' %}

    <div class="page-banner-area"
        style="background-image:url({{ url_for('static', filename='img/banner/logo101.png') }});">
        <div class="container">
            <div class="page-banner-content">
                <h1>GALLERY</h1>
                <ul class="page-breadcrumb">
                    <li><a href="{{ url_for('public.index') }}">Home</a></li>
                    <li>Gallery</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="gallery-area section-padding reveal-on-scroll">
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <div class="section-title-wrapper">
                        <div class="section-title">
                            <h3>OUR GALLERY</h3>
                            <p>Moments from campus life and activities</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                {% for i in range(1,10) %}
                <div class="col-lg-4 col-md-6 col-12 mb-30">
                    <div class="gallery-img" style="overflow:hidden;border-radius:8px;box-shadow:0 5px 20px rgba(0,0,0,0.08);">
                        <a href="{{ url_for('static', filename='img/gallery/gallery' + i|string + '.jpg') }}" data-fancybox="gallery">
                            <img src="{{ url_for('static', filename='img/gallery/gallery' + i|string + '.jpg') }}" alt="Gallery {{ i }}" style="width:100%;height:250px;object-fit:cover;transition:transform 0.4s;" loading="lazy" decoding="async">
                        </a>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    {% include 'includes/footer.html' %}
    </div></div>
    {% include 'includes/scripts.html' %}
</body>
</html>
