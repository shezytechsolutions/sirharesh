{% extends 'admin/base.html' %}
{% block title %}Change password{% endblock %}
{% block page_title %}Change password{% endblock %}
{% block content_class %}narrow{% endblock %}
{% block content %}
<div class="panel"><div class="panel-body">
  <p class="sub">Use at least 6 characters. You stay logged in after the change.</p>
  <form method="post" action="{{ url_for('admin.admin_change_password') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label">Current password</label>
    <input type="password" name="current_password" class="form-control" required>
    <label class="form-label">New password</label>
    <input type="password" name="new_password" class="form-control" required minlength="6">
    <label class="form-label">Confirm new password</label>
    <input type="password" name="confirm_password" class="form-control" required minlength="6">
    <div class="btn-row">
      <button type="submit" class="btn btn-primary">Save password</button>
      <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div></div>
{% endblock %}
