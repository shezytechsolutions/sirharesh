<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin login - AIMS Sukkur</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin/admin.css') }}">
</head>
<body class="login-page">
<div class="login-card">
  <div class="sidebar-logo">AS</div>
  <h1>Admin login</h1>
  <p class="sub">AIMS Sukkur control panel</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  <form method="post" action="{{ url_for('admin.admin_login') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label">Username</label>
    <input type="text" name="username" class="form-control" required autofocus>
    <label class="form-label">Password</label>
    <input type="password" name="password" class="form-control" required>
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  <div class="back-link"><a href="{{ url_for('public.index') }}">Back to website</a></div>
</div>
</body>
</html>
